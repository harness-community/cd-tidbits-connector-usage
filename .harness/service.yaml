service:
  name: podinfo
  identifier: podinfo
  # REPLACE
  orgIdentifier: <YOUR_ORG_IDENTIFIER>
  # REPLACE
  projectIdentifier: <YOUR_PROJECT_IDENTIFIER>
  description: podinfo built from harness-community/podinfo, image on Docker Hub
  tags: {}
  serviceDefinition:
    type: Kubernetes
    spec:
      artifacts:
        primary:
          primaryArtifactRef: podinfo_image
          sources:
            - identifier: podinfo_image
              type: DockerRegistry
              spec:
                connectorRef: dockerhubconnector
                # REPLACE: Docker Hub repo you can push to (user/podinfo)
                imagePath: <YOUR_DOCKERHUB_USER>/podinfo
                tag: <+input>
      manifests:
        - manifest:
            identifier: podinfo_manifests
            type: Kustomize
            spec:
              skipResourceVersioning: false
              store:
                type: Github
                spec:
                  connectorRef: githubconnector
                  repoName: harness-community/podinfo
                  gitFetchType: Branch
                  branch: master
                  folderPath: kustomize
