infrastructureDefinition:
  name: EKS Direct
  identifier: eks_direct
  # REPLACE
  orgIdentifier: <YOUR_ORG_IDENTIFIER>
  # REPLACE
  projectIdentifier: <YOUR_PROJECT_IDENTIFIER>
  description: Direct Kubernetes on EKS via the AWS OIDC connector (not GitOps)
  tags: {}
  environmentRef: tidbit
  deploymentType: Kubernetes
  type: KubernetesAws
  spec:
    # REPLACE: AWS OIDC connector (connectors/eks_oidc.yaml)
    connectorRef: eks_oidc
    # REPLACE: <region>/<cluster-name>, e.g. us-east-1/my-eks
    cluster: <YOUR_AWS_REGION>/<YOUR_EKS_CLUSTER>
    # REPLACE: existing namespace the OIDC role can deploy into
    namespace: podinfo
    releaseName: release-<+INFRA_KEY_SHORT_ID>
  allowSimultaneousDeployments: false
