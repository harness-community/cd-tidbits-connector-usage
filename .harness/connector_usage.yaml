# Sample Harness pipeline for the "Connector Usage" tidbit.
#
# Paste into the YAML editor in pipeline studio. Replace every # REPLACE: line.
#
# Default path: Harness Cloud + Docker Hub connector. Pulls alpine:3.20 through
# connectorRef — no codebase, no delegate, no cluster required.

pipeline:
  name: Connector Usage
  identifier: tidbit_connector_usage
  # REPLACE: set projectIdentifier to your own Harness project
  projectIdentifier: <YOUR_PROJECT_IDENTIFIER>
  # REPLACE: set orgIdentifier to your own Harness org
  orgIdentifier: <YOUR_ORG_IDENTIFIER>
  tags: {}
  stages:
    - stage:
        name: Use Artifact Connector
        identifier: use_artifact_connector
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          # --- Optional: run this stage on your cluster instead of Cloud ---
          # Delete platform + runtime above and use:
          # infrastructure:
          #   type: KubernetesDirect
          #   spec:
          #     # REPLACE: Kubernetes cluster connector id (connectors/k8s.yaml)
          #     connectorRef: k8s_cluster
          #     namespace: harness-delegate-ng
          #     automountServiceAccountToken: true
          #     os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Pull image via connector
                  identifier: pull_image_via_connector
                  spec:
                    shell: Sh
                    # REPLACE: Docker Hub connector id (connectors/dockerhub.yaml).
                    # Account/org scope: account.dockerhub / org.dockerhub
                    # Swap to ecr_docker / gcr_docker (and a matching image) to
                    # prove ECR or GCR the same way.
                    connectorRef: dockerhub
                    image: alpine:3.20
                    command: |-
                      echo "Pulled this image through the artifact connector on connectorRef."
                      echo "Image: alpine:3.20"
                      echo "---"
                      cat /etc/os-release
                      echo "---"
                      echo "SUCCESS: artifact connector authenticated the pull."
