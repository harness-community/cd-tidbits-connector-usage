# Amazon ECR — use an AWS connector, not a Docker Registry connector.
#
# ECR login tokens last 12 hours. A Docker Registry connector pointed at ECR
# with a static password would expire twice a day. An AWS connector lets
# Harness mint a fresh token on each run (IAM user keys, IRSA, or OIDC).
#
# In CI, pair this connector with:
#   - BuildAndPushECR  (build + push)
#   - a Run step whose image lives in ECR (pull)
#
# Create the two Text Secrets first: aws_access_key, aws_secret_key.

connector:
  name: AWS ECR
  identifier: aws_ecr
  description: Cloud connector used to authenticate to Amazon ECR
  type: Aws
  spec:
    credential:
      type: ManualConfig
      spec:
        # REPLACE: secret ids for an IAM user that can ecr:GetAuthorizationToken
        # plus ecr:BatchGetImage / ecr:PutImage for the repos you use.
        accessKeyRef: aws_access_key
        secretKeyRef: aws_secret_key
    executeOnDelegate: false

