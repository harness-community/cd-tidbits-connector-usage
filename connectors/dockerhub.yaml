# Docker Hub artifact connector — used to push the image this pipeline builds
# and to generate an imagePullSecret for the EKS deploy.
#
# Create the Text Secret first (Project Settings → Secrets):
#   id: dockerhub_token  value: a Docker Hub *access token* (not your password)
#
# Then: Project Settings → Connectors → Docker Registry, or import this YAML.

connector:
  name: Docker Hub
  identifier: dockerhub
  description: Artifact connector — push/pull images on Docker Hub
  type: DockerRegistry
  spec:
    dockerRegistryUrl: https://index.docker.io/v2/
    providerType: DockerHub
    auth:
      type: UsernamePassword
      spec:
        # REPLACE: your Docker Hub username
        username: <YOUR_DOCKERHUB_USER>
        # REPLACE: Harness Text Secret id holding a Hub access token
        passwordRef: dockerhub_token
    executeOnDelegate: false
