# Google Container Registry — use a GCP connector.
#
# GCR is legacy; new repos should live in Artifact Registry (GAR). The same
# GCP connector covers GCR, GAR, GKE, and other GCP APIs. Store the service
# account JSON as a Harness File or Text secret — never commit it.
#
# Create the secret first: Project Settings → Secrets → File (recommended)
# or Text, paste the SA JSON, id = gcp_sa_key.

connector:
  name: GCP GCR
  identifier: gcp_gcr
  description: Cloud connector used to authenticate to GCR / GAR
  type: Gcp
  spec:
    credential:
      type: ManualConfig
      spec:
        # REPLACE: secret id of the service account JSON key
        secretKeyRef: gcp_sa_key
    executeOnDelegate: false

