# GitHub connector — clone source (podinfo) and fetch deploy manifests.
#
# Create the Text Secret first: id github_pat, value = a GitHub PAT
# (repo scope for private repos; public_repo is enough for public clones).
#
# Then: Project Settings → Connectors → GitHub.

connector:
  name: GitHub
  identifier: github
  description: Code connector — clone repos with a GitHub PAT
  type: Github
  spec:
    # Account URL so one connector can clone podinfo and this tidbit repo
    url: https://github.com
    type: Account
    authentication:
      type: Http
      spec:
        type: UsernameToken
        spec:
          # REPLACE: GitHub username that owns the PAT
          username: <YOUR_GITHUB_USER>
          # REPLACE: Harness Text Secret id holding the PAT
          tokenRef: github_pat
    apiAccess:
      type: Token
      spec:
        tokenRef: github_pat
    executeOnDelegate: false
