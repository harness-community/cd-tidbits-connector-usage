# GitHub connector — clone podinfo and fetch Kustomize manifests.
# Repo-scoped (not Account). Create the Text Secret first:
#   id: github-pat  value: a GitHub PAT
#
# Then: Project Settings → Connectors → GitHub.

connector:
  name: github-connector
  identifier: githubconnector
  description: ""
  # REPLACE
  orgIdentifier: <YOUR_ORG_IDENTIFIER>
  # REPLACE
  projectIdentifier: <YOUR_PROJECT_IDENTIFIER>
  type: Github
  spec:
    url: https://github.com/harness-community/podinfo
    authentication:
      type: Http
      spec:
        type: UsernameToken
        spec:
          # REPLACE: GitHub username that owns the PAT
          username: <YOUR_GITHUB_USER>
          tokenRef: github-pat
    executeOnDelegate: false
    proxy: false
    ignoreTestConnection: false
    type: Repo
