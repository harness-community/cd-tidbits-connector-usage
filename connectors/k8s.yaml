# Kubernetes cluster connector — infrastructure, not artifacts.
#
# A K8s connector cannot pull from ECR/GCR. Pair it with an artifact connector
# (dockerhub / aws_ecr / gcp_gcr) when a stage needs both a cluster to run on
# and images to pull.
#
# Variant A (simplest when a Harness Delegate already runs in the cluster):
# inherit the in-cluster kube credentials from that delegate.

connector:
  name: K8s Cluster
  identifier: k8s_cluster
  description: Infrastructure connector for a Kubernetes build farm / deploy target
  type: K8sCluster
  spec:
    credential:
      type: InheritFromDelegate
      spec: {}
    # REPLACE: tag(s) of the delegate that lives in (or can reach) the cluster
    delegateSelectors:
      - kubernetes-delegate

