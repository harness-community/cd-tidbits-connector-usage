# AWS connector with OIDC — used as the EKS (KubernetesAws) infrastructure
# connector. Harness federates to an IAM role; no access keys in Git.
#
# AWS setup (once per account):
#   1. IAM OIDC identity provider
#        URL:      https://app.harness.io/ng/api/oidc/account/<HARNESS_ACCOUNT_ID>
#        Audience: sts.amazonaws.com
#   2. IAM role trusted by that provider (sts:AssumeRoleWithWebIdentity)
#   3. Role permissions: eks:DescribeCluster (+ ListClusters for the picker UI)
#   4. EKS access entry mapping that role to a Kubernetes group that can
#      deploy into your namespace (e.g. AmazonEKSEditPolicy on the namespace)
#
# Connector: Project Settings → Connectors → AWS → Use OIDC.

connector:
  name: EKS OIDC
  identifier: eks_oidc
  description: AWS OIDC connector for EKS (direct Kubernetes, not GitOps)
  type: Aws
  spec:
    credential:
      type: OidcAuthentication
      spec:
        # REPLACE: IAM role ARN Harness assumes via OIDC
        iamRoleArn: arn:aws:iam::<YOUR_AWS_ACCOUNT_ID>:role/<YOUR_HARNESS_OIDC_ROLE>
    # REPLACE: region used for the connector Test Connection
    region: <YOUR_AWS_REGION>
    executeOnDelegate: false
